name: probe-termux-docker

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Inspect image shells and libs
        run: |
          docker pull termux/termux-docker:aarch64@sha256:d9e15c9751ed0e5d436ca32f97bf02b670cc004df4b01b7bfd8d145a84ba0575
          IMG=termux/termux-docker:aarch64@sha256:d9e15c9751ed0e5d436ca32f97bf02b670cc004df4b01b7bfd8d145a84ba0575
          echo "--- default entrypoint, which bash:"; docker run --rm "$IMG" which bash sh echo || true
          echo "--- PREFIX lib set:"; docker run --rm "$IMG" ls /data/data/com.termux/files/usr/lib/ | head -30 || true
          echo "--- libandroid-support present?:"; docker run --rm "$IMG" ls /data/data/com.termux/files/usr/lib/libandroid-support.so 2>&1 || true
          echo "--- system lib dir:"; docker run --rm "$IMG" ls /system/lib64/ 2>&1 | head -20 || true
          echo "--- pkg root guard:"; docker run --rm --entrypoint /data/data/com.termux/files/usr/bin/bash "$IMG" -c 'grep -n -B1 -A3 "id -u\|EUID" /data/data/com.termux/files/usr/bin/pkg /data/data/com.termux/files/usr/bin/apt-get 2>&1 | head -20' || true
