name: termux-native-gallium

# True Termux binaries ($PREFIX, bionic): arm64 runner + proot + official
# Termux bootstrap. These drop into /data/data/com.termux/files/usr.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      TROOT: ${{ github.workspace }}/termux-root
      BOOTSTRAP_TAG: bootstrap-2026.10.11-r1+apt.android-7
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install proot
        run: sudo apt-get update -q && sudo apt-get install -qy proot

      - name: Set up Termux userland
        run: |
          cd "${{ github.workspace }}"
          curl -sL -o bootstrap.zip \
            "https://github.com/termux/termux-packages/releases/download/${BOOTSTRAP_TAG}/bootstrap-aarch64.zip"
          mkdir -p "$TROOT" && unzip -q bootstrap.zip -d "$TROOT"
          # Recreate packaged symlinks (SYMLINKS.txt format: target<-link).
          cd "$TROOT"
          while IFS= read -r line; do
            target="${line%%<-*}"; link="${line##*<-}"
            ln -sfn "$target" ".$link"
          done < SYMLINKS.txt
          # Make the canonical $PREFIX path resolve inside proot.
          mkdir -p data/data/com.termux/files
          ln -sfn ../../../.. data/data/com.termux/files/usr
          ls -la data/data/com.termux/files/
          chmod +x "${{ github.workspace }}/.github/run-in-termux.sh"

      - name: Install Termux build deps
        run: |
          .github/run-in-termux.sh "
            pkg update -y &&
            pkg install -y python clang bison flex pkg-config ninja cmake git \
              libdrm xorgproto libx11 libxcb libxshmfence \
              libandroid-shmem-static spirv-tools spirv-llvm-translator \
              libclc glslang &&
            pip install -q meson mako pyyaml packaging setuptools
          "

      - name: Configure (Gallium panfrost + kbase, x11)
        run: |
          .github/run-in-termux.sh "
            meson setup build-termux \
              -Dbuildtype=release \
              -Dgallium-drivers=panfrost \
              -Dvulkan-drivers= \
              -Dplatforms=x11 \
              -Dpanfrost-kmds=kbase,panthor \
              -Dbuild-tests=false \
              -Dprefix=/data/data/com.termux/files/usr \
              -Dc_link_args=-landroid-shmem \
              -Dcpp_link_args=-landroid-shmem
          "

      - name: Build + stage install
        run: |
          .github/run-in-termux.sh "
            ninja -C build-termux &&
            DESTDIR=/repo/stage ninja -C build-termux install
          "

      - name: Package Termux drop-in
        run: |
          cd stage/data/data/com.termux/files/usr
          tar -czf "$GITHUB_WORKSPACE/panfrost-g57-termux.tar.gz" lib/dri/panfrost* lib/libGL* lib/libEGL* 2>/dev/null || \
          tar -czf "$GITHUB_WORKSPACE/panfrost-g57-termux.tar.gz" lib/

      - name: Upload Termux package
        uses: actions/upload-artifact@v4
        with:
          name: panfrost-g57-termux
          path: panfrost-g57-termux.tar.gz
