name: android-gallium-kbase

on:
  workflow_dispatch:
  push:
    branches: [main, gallium-kbase-jm-v1]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install LLVM 21 repo (one major version for clang/libclc/SPIRV)
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy wget gnupg
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update -q

      - name: Install build deps
        run: |
          sudo apt-get install -qy meson ninja-build pkg-config flex bison cmake \
            python3-mako python3-packaging python3-yaml python3-pip \
            llvm-21-dev libclang-21-dev clang-21 libclc-21-dev
          # Runner meson (1.3.x) is too old for Mesa (>= 1.4.0): upgrade via pip.
          sudo pip3 install -U --break-system-packages meson
          meson --version

      - name: Build SPIRV-LLVM-Translator 21.1 (not packaged for noble)
        run: |
          cd /tmp
          git clone --depth 1 --branch v21.1.9 https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git
          cmake -S SPIRV-LLVM-Translator -B spirv-build \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=/usr/lib/llvm-21/cmake
          cmake --build spirv-build -j"$(nproc)"
          sudo cmake --install spirv-build

      - name: Install Android NDK r29
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Cross-build Gallium panfrost (kbase) + EGL/GLES
        run: ./build-android-ci.sh

      - name: Upload driver zip
        uses: actions/upload-artifact@v4
        with:
          name: panfrost-g57-kbase-android
          path: dist/panfrost-g57-kbase-android.zip
